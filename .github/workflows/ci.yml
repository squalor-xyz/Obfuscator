name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Obfuscator.slnx

      - name: Build
        run: dotnet build Obfuscator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Obfuscator.slnx --configuration Release --no-build

      - name: Local pack and CLI smoke
        if: github.event_name == 'push'
        run: ./scripts/test-local.sh
        shell: bash
