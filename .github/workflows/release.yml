name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to main
        run: |
          git fetch origin main --depth=1
          git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Obfuscator.slnx

      - name: Test
        run: dotnet test Obfuscator.slnx --configuration Release --no-restore

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack library
        run: >
          dotnet pack Obfuscator/Obfuscator.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/nuget

      - name: Pack CLI tool
        run: >
          dotnet pack Obfuscator.Cli/Obfuscator.Cli.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/nuget

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
